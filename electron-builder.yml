appId: com.classclarus.app
productName: ClassClarus
copyright: Copyright © ClassClarus
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - package.json
extraResources:
  # Populated by scripts/electron-pack.mjs (platform binary only)
  - from: resources/convex-backend-bundle
    to: convex-backend
    filter:
      - "**/*"
  - from: resources/deploy-project
    to: deploy-project
    filter:
      - "**/*"
  - from: dist
    to: renderer
    filter:
      - "**/*"
asar: true
asarUnpack:
  - "**/*.node"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ClassClarus-Setup-Windows.${ext}
mac:
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: ClassClarus-macOS.${ext}
  category: public.app-category.education
  # Unsigned by default; add CSC_* secrets in CI for Gatekeeper-friendly builds.
  identity: null
linux:
  target:
    - AppImage
  artifactName: ClassClarus-Linux.${ext}
  category: Education
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  releaseType: release
